# =============================================================
# application.properties - TourismFX Configuration
# =============================================================
# Spring Boot configuration for the Tourism Docket Management System.
#
# SETUP INSTRUCTIONS (Windows + VS Code):
#   1. Install MySQL 8.x and create a database named 'tourismfx_db'
#   2. Update the database URL, username, and password below
#   3. For email: update SMTP settings (or leave defaults for testing)
#   4. For PayPal/M-Pesa: the app uses MockPaymentGateway by default
#      (no real credentials needed for development)
#
# To override these values without modifying this file, use:
#   - Environment variables: SPRING_DATASOURCE_URL=jdbc:mysql://...
#   - Command line args:     --spring.datasource.url=jdbc:mysql://...
#   - External file:         application-local.properties
# =============================================================

# ===================== SERVER CONFIGURATION =====================
# Port where the application runs (default: 8080)
server.port=8080

# Application name (shown in logs and actuator)
spring.application.name=TourismFX

# ===================== DATABASE CONFIGURATION =====================
# MySQL connection URL — update host/port/database as needed
spring.datasource.url=jdbc:mysql://localhost:3306/tourismfx_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true

# MySQL credentials — CHANGE THESE for your environment
spring.datasource.username=root
spring.datasource.password=root

# MySQL JDBC driver (auto-detected, but explicit is safer)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / HIBERNATE CONFIGURATION =====================
# ddl-auto options:
#   update  : Auto-create/update tables based on entities (dev/test)
#   validate: Only validate schema, don't modify (production)
#   create  : Drop and recreate all tables on startup (destructive!)
#   none    : Do nothing
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (helpful for debugging, disable in prod)
spring.jpa.show-sql=true

# Format SQL for readability in console
spring.jpa.properties.hibernate.format_sql=true

# MySQL dialect for optimized SQL generation
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===================== THYMELEAF CONFIGURATION =====================
# Disable template caching during development (enables hot reload)
spring.thymeleaf.cache=false

# Template file encoding
spring.thymeleaf.encoding=UTF-8

# Enable Thymeleaf Spring Security dialect for sec: attributes
spring.thymeleaf.enabled=true

# ===================== EMAIL CONFIGURATION =====================
# SMTP settings for sending receipt emails.
# Default: Gmail SMTP (update with your email provider settings)
#
# For Gmail:
#   1. Enable "Less Secure App Access" OR use App Password
#   2. Set spring.mail.username to your Gmail address
#   3. Set spring.mail.password to your App Password
#
# For testing without email: leave as-is (emails will fail silently)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===================== FILE UPLOAD / RECEIPT STORAGE =====================
# Directory where generated PDF receipts are stored
app.receipts.directory=receipts

# Maximum file upload size (for hotel images, etc.)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===================== LOGGING CONFIGURATION =====================
# Log level for the application (DEBUG for development, INFO for production)
logging.level.com.example.tourismfx=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# Log file (optional — logs to console by default)
# logging.file.name=logs/tourismfx.log

# ===================== SPRING SECURITY =====================
# Disable default security password generation message
# (We use our own UserDetailsService with BCrypt)
spring.security.user.name=disabled
spring.security.user.password=disabled

# ===================== SQL INITIALIZATION =====================
# Initialize database with schema.sql and data.sql on startup
# Set to 'never' if using JPA auto-create
spring.sql.init.mode=never
# spring.sql.init.schema-locations=classpath:db/schema.sql
# spring.sql.init.data-locations=classpath:db/data.sql
