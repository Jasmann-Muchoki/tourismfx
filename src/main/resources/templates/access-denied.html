<!DOCTYPE html>
<!--
    access-denied.html - 403 Forbidden Page
    ==========================================
    Shown when a user tries to access a page they don't have permission for
    (e.g., a tourist trying to access /admin pages).
-->
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head"></head>
<body class="auth-page d-flex align-items-center min-vh-100">
<div class="container text-center">
    <i class="fas fa-ban fa-5x text-danger mb-4"></i>
    <h1 class="text-white">Access Denied</h1>
    <p class="text-muted fs-5 mb-4">You don't have permission to access this page.</p>
    <a th:href="@{/dashboard}" class="btn btn-primary rounded-pill px-4 me-2">
        <i class="fas fa-tachometer-alt me-1"></i>Go to Dashboard
    </a>
    <a th:href="@{/home}" class="btn btn-outline-light rounded-pill px-4">
        <i class="fas fa-home me-1"></i>Go Home
    </a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
