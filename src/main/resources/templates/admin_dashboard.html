<!DOCTYPE html>
<!--
    admin_dashboard.html - Admin Management Dashboard
    ====================================================
    Provides admin tools for managing hotels, rooms, and viewing bookings.
    Only accessible to users with ROLE_ADMIN.
    
    Controller: AdminDashboardController.showDashboard()
    Model attributes:
      - bookings:          List<HotelBooking> - all bookings
      - hotels:            List<Hotel> - all hotels
      - totalBookings:     long - total booking count
      - confirmedBookings: long - confirmed booking count
      - pendingBookings:   long - pending booking count
      - totalRevenue:      BigDecimal - sum of confirmed booking amounts
-->
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="fragments/layout :: navbar"></div>

<main class="flex-grow-1" style="padding-top: 80px;">
    <div class="container py-4">
        <h2 class="text-white mb-4"><i class="fas fa-cog me-2"></i>Admin Dashboard</h2>

        <!-- Messages -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle me-2"></i><span th:text="${successMessage}">Success</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMessage}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Statistics cards row -->
        <div class="row g-4 mb-5">
            <div class="col-md-3">
                <div class="card glass-card text-center p-3">
                    <i class="fas fa-calendar-check fa-2x text-primary mb-2"></i>
                    <h3 class="text-white" th:text="${totalBookings}">0</h3>
                    <p class="text-muted mb-0">Total Bookings</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card glass-card text-center p-3">
                    <i class="fas fa-check-circle fa-2x text-success mb-2"></i>
                    <h3 class="text-white" th:text="${confirmedBookings}">0</h3>
                    <p class="text-muted mb-0">Confirmed</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card glass-card text-center p-3">
                    <i class="fas fa-clock fa-2x text-warning mb-2"></i>
                    <h3 class="text-white" th:text="${pendingBookings}">0</h3>
                    <p class="text-muted mb-0">Pending</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card glass-card text-center p-3">
                    <i class="fas fa-dollar-sign fa-2x text-info mb-2"></i>
                    <h3 class="text-warning">$<span th:text="${#numbers.formatDecimal(totalRevenue, 1, 2)}">0</span></h3>
                    <p class="text-muted mb-0">Revenue</p>
                </div>
            </div>
        </div>

        <!-- Add Hotel form -->
        <div class="card glass-card mb-4">
            <div class="card-header bg-transparent border-secondary">
                <h4 class="text-primary mb-0"><i class="fas fa-plus-circle me-2"></i>Add New Hotel</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/hotels/add}" method="post" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label text-light">Hotel Name *</label>
                        <input type="text" class="form-control" name="name" required/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-light">Location *</label>
                        <input type="text" class="form-control" name="location" required/>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-light">Star Rating *</label>
                        <select class="form-select" name="starRating" required>
                            <option value="1">1 Star</option>
                            <option value="2">2 Stars</option>
                            <option value="3" selected>3 Stars</option>
                            <option value="4">4 Stars</option>
                            <option value="5">5 Stars</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-light">Contact Phone</label>
                        <input type="tel" class="form-control" name="contactPhone"/>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-light">Contact Email</label>
                        <input type="email" class="form-control" name="contactEmail"/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-light">Description</label>
                        <textarea class="form-control" name="description" rows="2"></textarea>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-plus me-1"></i>Add Hotel
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Add Room form -->
        <div class="card glass-card mb-4" th:if="${!#lists.isEmpty(hotels)}">
            <div class="card-header bg-transparent border-secondary">
                <h4 class="text-primary mb-0"><i class="fas fa-bed me-2"></i>Add Room to Hotel</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/rooms/add}" method="post" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label text-light">Hotel *</label>
                        <select class="form-select" name="hotelId" required>
                            <option value="" disabled selected>Select Hotel</option>
                            <option th:each="hotel : ${hotels}" th:value="${hotel.id}"
                                    th:text="${hotel.name}">Hotel</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-light">Room Type *</label>
                        <input type="text" class="form-control" name="roomType"
                               placeholder="e.g. Deluxe Suite" required/>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-light">Price/Night *</label>
                        <input type="number" class="form-control" name="pricePerNight"
                               step="0.01" min="0" required/>
                    </div>
                    <div class="col-md-1">
                        <label class="form-label text-light">Capacity</label>
                        <input type="number" class="form-control" name="capacity" value="2" min="1"/>
                    </div>
                    <div class="col-md-1">
                        <label class="form-label text-light">Rooms</label>
                        <input type="number" class="form-control" name="totalRooms" value="5" min="1"/>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">
                            <i class="fas fa-plus me-1"></i>Add Room
                        </button>
                    </div>
                    <div class="col-12">
                        <label class="form-label text-light">Description</label>
                        <input type="text" class="form-control" name="description"
                               placeholder="Room amenities and features"/>
                    </div>
                </form>
            </div>
        </div>

        <!-- All bookings table -->
        <div class="card glass-card">
            <div class="card-header bg-transparent border-secondary">
                <h4 class="text-primary mb-0"><i class="fas fa-list me-2"></i>All Bookings</h4>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Reference</th>
                                <th>Tourist</th>
                                <th>Hotel</th>
                                <th>Room</th>
                                <th>Check-in</th>
                                <th>Check-out</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Created</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="booking : ${bookings}">
                                <td class="fw-bold" th:text="${booking.bookingReference}">REF</td>
                                <td th:text="${booking.tourist.user.fullName}">Tourist</td>
                                <td th:text="${booking.room.hotel.name}">Hotel</td>
                                <td th:text="${booking.room.roomType}">Room</td>
                                <td th:text="${booking.checkInDate}">Date</td>
                                <td th:text="${booking.checkOutDate}">Date</td>
                                <td class="text-warning fw-bold">
                                    $<span th:text="${#numbers.formatDecimal(booking.totalPrice, 1, 2)}">0</span>
                                </td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${booking.status == 'CONFIRMED'} ? 'bg-success' :
                                                          (${booking.status == 'PENDING'} ? 'bg-warning text-dark' :
                                                          (${booking.status == 'CANCELLED'} ? 'bg-danger' : 'bg-info'))"
                                          th:text="${booking.status}">Status</span>
                                </td>
                                <td class="text-muted" th:text="${booking.createdAt}">Date</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(bookings)}">
                                <td colspan="9" class="text-center text-muted py-4">No bookings yet</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/layout :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
