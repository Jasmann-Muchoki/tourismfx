<!DOCTYPE html>
<!--
    booking.html - Booking Creation Form
    =======================================
    Form for creating a new hotel booking.
    Displays room details and collects check-in/out dates and guest count.
    
    Controller: BookingController.showBookingForm()
    Model attributes:
      - room:    Room entity (selected room)
      - hotel:   Hotel entity (room's hotel)
      - minDate: LocalDate (today, prevents past dates)
-->
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="fragments/layout :: navbar"></div>

<main class="flex-grow-1" style="padding-top: 80px;">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Back link -->
                <a th:href="@{/hotels/{id}(id=${hotel.id})}" class="btn btn-outline-light mb-4 rounded-pill">
                    <i class="fas fa-arrow-left me-1"></i>Back to Hotel
                </a>

                <h2 class="text-white mb-4"><i class="fas fa-calendar-plus me-2"></i>Book Your Stay</h2>

                <!-- Error messages -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${errorMessage}">Error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="row">
                    <!-- Booking form -->
                    <div class="col-md-7">
                        <div class="card glass-card">
                            <div class="card-body p-4">
                                <h4 class="text-primary mb-4">Reservation Details</h4>

                                <form th:action="@{/bookings/create}" method="post">
                                    <!-- Hidden room ID -->
                                    <input type="hidden" name="roomId" th:value="${room.id}"/>

                                    <!-- Check-in date -->
                                    <div class="mb-3">
                                        <label for="checkInDate" class="form-label text-light">
                                            <i class="fas fa-calendar-alt me-1"></i>Check-in Date *
                                        </label>
                                        <input type="date" class="form-control" id="checkInDate"
                                               name="checkInDate" th:min="${minDate}" required/>
                                    </div>

                                    <!-- Check-out date -->
                                    <div class="mb-3">
                                        <label for="checkOutDate" class="form-label text-light">
                                            <i class="fas fa-calendar-alt me-1"></i>Check-out Date *
                                        </label>
                                        <input type="date" class="form-control" id="checkOutDate"
                                               name="checkOutDate" th:min="${minDate}" required/>
                                    </div>

                                    <!-- Number of guests -->
                                    <div class="mb-3">
                                        <label for="numberOfGuests" class="form-label text-light">
                                            <i class="fas fa-users me-1"></i>Number of Guests *
                                        </label>
                                        <input type="number" class="form-control" id="numberOfGuests"
                                               name="numberOfGuests" min="1" th:max="${room.capacity}"
                                               value="1" required/>
                                        <small class="text-muted">
                                            Maximum: <span th:text="${room.capacity}">2</span> guests
                                        </small>
                                    </div>

                                    <!-- Special requests -->
                                    <div class="mb-4">
                                        <label for="specialRequests" class="form-label text-light">
                                            <i class="fas fa-comment me-1"></i>Special Requests
                                        </label>
                                        <textarea class="form-control" id="specialRequests"
                                                  name="specialRequests" rows="3"
                                                  placeholder="e.g., late check-in, extra pillows..."></textarea>
                                    </div>

                                    <!-- Submit button -->
                                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill">
                                        <i class="fas fa-credit-card me-2"></i>Proceed to Payment
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Room summary sidebar -->
                    <div class="col-md-5">
                        <div class="card glass-card">
                            <div class="card-body p-4">
                                <h5 class="text-primary mb-3">Room Summary</h5>
                                <table class="table table-dark table-borderless">
                                    <tr>
                                        <td class="text-muted">Hotel</td>
                                        <td class="text-white" th:text="${hotel.name}">Hotel</td>
                                    </tr>
                                    <tr>
                                        <td class="text-muted">Location</td>
                                        <td class="text-white" th:text="${hotel.location}">Location</td>
                                    </tr>
                                    <tr>
                                        <td class="text-muted">Room Type</td>
                                        <td class="text-white" th:text="${room.roomType}">Room</td>
                                    </tr>
                                    <tr>
                                        <td class="text-muted">Price/Night</td>
                                        <td class="text-warning fw-bold">
                                            $<span th:text="${#numbers.formatDecimal(room.pricePerNight, 1, 2)}">0</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="text-muted">Capacity</td>
                                        <td class="text-white" th:text="${room.capacity} + ' guests'">2</td>
                                    </tr>
                                    <tr>
                                        <td class="text-muted">Available</td>
                                        <td>
                                            <span class="badge bg-success"
                                                  th:text="${room.availableRooms} + ' rooms'">1</span>
                                        </td>
                                    </tr>
                                </table>
                                <hr class="border-secondary"/>
                                <p class="text-muted small" th:text="${room.description}">Room description</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/layout :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Client-side date validation: ensure check-out is after check-in -->
<script>
    document.getElementById('checkInDate').addEventListener('change', function() {
        document.getElementById('checkOutDate').min = this.value;
    });
</script>
</body>
</html>
