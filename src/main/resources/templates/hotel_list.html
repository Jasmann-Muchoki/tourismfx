<!DOCTYPE html>
<!--
    hotel_list.html - Hotel Listing Page
    ======================================
    Displays all active hotels in a responsive card grid.
    Supports search by name, filter by location and star rating.
    
    Controller: HotelListController.listHotels()
    Model attributes:
      - hotels:         List<Hotel> - hotels to display
      - searchTerm:     String - current search query (if any)
      - locationFilter: String - current location filter (if any)
      - ratingFilter:   Integer - current rating filter (if any)
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/layout :: head"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="fragments/layout :: navbar"></div>

<!-- Page content with top padding for fixed navbar -->
<main class="flex-grow-1" style="padding-top: 80px;">
    <div class="container py-4">
        <!-- Page header -->
        <div class="text-center mb-5">
            <h1 class="text-white fw-bold"><i class="fas fa-hotel me-2"></i>Explore Hotels</h1>
            <p class="text-muted fs-5">Find your perfect stay from our curated collection</p>
        </div>

        <!-- Search and filter bar -->
        <div class="card glass-card mb-4">
            <div class="card-body">
                <form th:action="@{/hotels}" method="get" class="row g-3 align-items-end">
                    <!-- Search by name -->
                    <div class="col-md-5">
                        <label class="form-label text-light">Search Hotels</label>
                        <input type="text" class="form-control" name="search"
                               th:value="${searchTerm}" placeholder="Search by hotel name..."/>
                    </div>
                    <!-- Filter by location -->
                    <div class="col-md-3">
                        <label class="form-label text-light">Location</label>
                        <input type="text" class="form-control" name="location"
                               th:value="${locationFilter}" placeholder="e.g. Nairobi"/>
                    </div>
                    <!-- Filter by rating -->
                    <div class="col-md-2">
                        <label class="form-label text-light">Min Rating</label>
                        <select class="form-select" name="rating">
                            <option value="">All</option>
                            <option value="3" th:selected="${ratingFilter == 3}">3+ Stars</option>
                            <option value="4" th:selected="${ratingFilter == 4}">4+ Stars</option>
                            <option value="5" th:selected="${ratingFilter == 5}">5 Stars</option>
                        </select>
                    </div>
                    <!-- Search button -->
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-search me-1"></i>Search
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Results count -->
        <p class="text-muted mb-3" th:if="${!#lists.isEmpty(hotels)}">
            Showing <strong th:text="${#lists.size(hotels)}">0</strong> hotels
        </p>

        <!-- No results message -->
        <div th:if="${#lists.isEmpty(hotels)}" class="text-center py-5">
            <i class="fas fa-search fa-4x text-muted mb-3"></i>
            <h4 class="text-white">No hotels found</h4>
            <p class="text-muted">Try adjusting your search filters</p>
            <a th:href="@{/hotels}" class="btn btn-outline-light">Show All Hotels</a>
        </div>

        <!-- Hotel cards grid -->
        <div class="row g-4">
            <div class="col-lg-4 col-md-6" th:each="hotel : ${hotels}">
                <div class="hotel-card card h-100">
                    <div class="card-img-top hotel-card-img"
                         th:style="'background-image: url(' + (${hotel.imageUrl} ?: '/images/hotel-default.jpg') + ')'">
                        <div class="star-badge">
                            <span th:each="i : ${#numbers.sequence(1, hotel.starRating)}">
                                <i class="fas fa-star text-warning"></i>
                            </span>
                        </div>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title text-white" th:text="${hotel.name}">Hotel Name</h5>
                        <p class="text-muted mb-2">
                            <i class="fas fa-map-marker-alt me-1 text-primary"></i>
                            <span th:text="${hotel.location}">Location</span>
                        </p>
                        <p class="card-text text-muted small"
                           th:text="${#strings.abbreviate(hotel.description, 120)}">Description</p>
                    </div>
                    <div class="card-footer border-0 d-flex gap-2">
                        <a th:href="@{/hotels/{id}(id=${hotel.id})}"
                           class="btn btn-primary flex-grow-1 rounded-pill">
                            <i class="fas fa-eye me-1"></i>View & Book
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/layout :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
