<!DOCTYPE html>
<!--
    booking_detail.html - Booking Detail View
    ============================================
    Shows detailed information about a specific booking.
    
    Controller: BookingController.viewBooking()
    Model attributes:
      - booking: HotelBooking entity
      - room:    Room entity
      - hotel:   Hotel entity
-->
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head"></head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="fragments/layout :: navbar"></div>

<main class="flex-grow-1" style="padding-top: 80px;">
    <div class="container py-4">
        <a th:href="@{/dashboard}" class="btn btn-outline-light mb-4 rounded-pill">
            <i class="fas fa-arrow-left me-1"></i>Back to Dashboard
        </a>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card glass-card">
                    <div class="card-body p-4">
                        <h2 class="text-white mb-4">
                            <i class="fas fa-calendar-check me-2"></i>Booking Details
                        </h2>

                        <div class="mb-3">
                            <span class="badge fs-6"
                                  th:classappend="${booking.status == 'CONFIRMED'} ? 'bg-success' :
                                                  (${booking.status == 'PENDING'} ? 'bg-warning text-dark' :
                                                  (${booking.status == 'CANCELLED'} ? 'bg-danger' : 'bg-info'))"
                                  th:text="${booking.status}">Status</span>
                        </div>

                        <table class="table table-dark table-borderless">
                            <tr><td class="text-muted">Reference</td>
                                <td class="fw-bold text-primary" th:text="${booking.bookingReference}">REF</td></tr>
                            <tr><td class="text-muted">Hotel</td>
                                <td class="text-white" th:text="${hotel.name}">Hotel</td></tr>
                            <tr><td class="text-muted">Room Type</td>
                                <td class="text-white" th:text="${room.roomType}">Room</td></tr>
                            <tr><td class="text-muted">Check-in</td>
                                <td class="text-white" th:text="${booking.checkInDate}">Date</td></tr>
                            <tr><td class="text-muted">Check-out</td>
                                <td class="text-white" th:text="${booking.checkOutDate}">Date</td></tr>
                            <tr><td class="text-muted">Guests</td>
                                <td class="text-white" th:text="${booking.numberOfGuests}">1</td></tr>
                            <tr><td class="text-muted">Total Price</td>
                                <td class="text-warning fw-bold fs-4">
                                    $<span th:text="${#numbers.formatDecimal(booking.totalPrice, 1, 2)}">0</span>
                                </td></tr>
                            <tr th:if="${booking.specialRequests != null}">
                                <td class="text-muted">Special Requests</td>
                                <td class="text-white" th:text="${booking.specialRequests}">None</td></tr>
                            <tr><td class="text-muted">Booked On</td>
                                <td class="text-muted" th:text="${booking.createdAt}">Date</td></tr>
                        </table>

                        <div class="d-flex gap-2 mt-4">
                            <a th:if="${booking.status == 'PENDING'}"
                               th:href="@{/payments/checkout/{id}(id=${booking.id})}"
                               class="btn btn-primary rounded-pill">
                                <i class="fas fa-credit-card me-1"></i>Pay Now
                            </a>
                            <a th:if="${booking.status == 'CONFIRMED'}"
                               th:href="@{/receipts/{id}(id=${booking.id})}"
                               class="btn btn-success rounded-pill">
                                <i class="fas fa-file-pdf me-1"></i>View Receipt
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="fragments/layout :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
